# cpu_qrf with the clay^1 CEC7 weights of the GPU runs: the full thinning grid with the forest learner
# only (CPU, roughly 30-60 min): QRF arms, the PTF baselines and all controls on the GPU runs' folds.
name: cpu_qrf_w1
n_folds: 5
folds: [0, 1, 2, 3, 4]
levels: [1.0, 0.3, 0.1, 0.03]
group_reps: 3
random_reps: 3
m: 100
k_chain: 20
residual: true
gate: true
cec_weight_power: 1.0      # CRPS-consistent CEC weights (clay^1); cpu_qrf keeps the pre-specified clay^2
min_train: 30
seed: 2026
abundant: {n_estimators: 300}
gate_model: {n_estimators: 300}
learners:
  qrf: {n_estimators: 300, min_samples_leaf: 5, max_features: 0.33}
